name: Build with MLIR Codegen

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      LIBRARY_PATH: /usr/lib/llvm-22/lib
      LD_LIBRARY_PATH: /usr/lib/llvm-22/lib

    steps:
      - name: Setup SSH Agent for Submodules
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCAML_BINDINGS_ACTIONS }}

      - name: Checkout Moonshot
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Setup SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Debug SSH access
        run: |
          ssh -T git@github.com || true
          git ls-remote git@github.com:pointblank-club/mlir_ocaml_bindings.git

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libtool libtool make m4 pkg-config

      - name: Install LLVM 22 and MLIR 22
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y libmlir-22-dev mlir-22-tools clang-22 llvm-22-dev

      - name: Add LLVM and MLIR to PATH
        run: |
          echo "/usr/lib/llvm-22/bin" >> $GITHUB_PATH

      - name: Restore OCaml and build cache
        uses: actions/cache/restore@v4
        id: opam-cache
        with:
          path: |
            _opam
            _build
            _install
          key: moonshot-cache-${{ runner.os }}-${{ hashFiles('oxcaml-dev.opam', 'dune-project') }}-${{ github.sha }}
          restore-keys: |
            moonshot-cache-${{ runner.os }}-${{ hashFiles('oxcaml-dev.opam', 'dune-project') }}-
            moonshot-cache-${{ runner.os }}-

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0

      - name: Initialize local switch if not restored
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -d "_opam" ]; then
            opam switch create . 5.4.0 -y
          fi

      - name: Install dependencies
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: opam install . --deps-only --with-test -y

      - name: Configure
        run: |
          opam exec -- autoconf
          opam exec -- ./configure --prefix=$(pwd)/_install

      - name: Build
        run: opam exec -- make install

      - name: Test
        run: opam exec -- make runtest-mlirize

      - name: Save OCaml and build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            _opam
            _build
            _install
          key: moonshot-cache-${{ runner.os }}-${{ hashFiles('oxcaml-dev.opam', 'dune-project') }}-${{ github.sha }}
