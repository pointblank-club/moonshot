name: Build with MLIR Codegen

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      LIBRARY_PATH: /usr/lib/llvm-22/lib
      LD_LIBRARY_PATH: /usr/lib/llvm-22/lib

    steps:
      - name: Setup SSH Agent for Submodules
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCAML_BINDINGS_ACTIONS }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libtool libtool make m4 pkg-config

      - name: Install LLVM 22 and MLIR 22
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y libmlir-22-dev mlir-22-tools clang-22 llvm-22-dev

      - name: Add LLVM and MLIR to PATH
        run: |
          echo "/usr/lib/llvm-22/bin" >> $GITHUB_PATH

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Configure
        run: |
          autoconf
          ./configure --prefix=_install

      - name: Build
        run: make install

